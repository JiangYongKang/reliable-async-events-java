# ===== 数据源：本地 H2 文件库（无需外部中间件；进程重启后事件仍在）=====
spring.datasource.url=jdbc:h2:file:./target/event-data/eventdb;MODE=LEGACY;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never

# ===== 可靠事件模块参数（reliable.events.*）=====
# 进程内调度器开关
reliable.events.dispatcher-enabled=true
# 消费工作线程数
reliable.events.worker-count=2
# 轮询间隔（毫秒）
reliable.events.poll-interval=200ms
# 每次扫描条数
reliable.events.batch-size=32
# 最大尝试次数（含首次），达到后进入死信 RETRY_EXHAUSTED
reliable.events.max-attempts=5
# 指数退避：初始间隔、倍数、上限、抖动比例
reliable.events.initial-backoff=200ms
reliable.events.backoff-multiplier=2.0
reliable.events.max-backoff=30s
reliable.events.jitter-factor=0.2
# 处理租约 TTL：消费者崩溃后超过此时长的 PROCESSING 事件被回收重试
reliable.events.lease-ttl=30s

# 日志：打印事件输入/状态变化/判定依据
logging.level.com.github.highcumontoa=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# ============================================================
# 可靠异步事件（进程内）配置
# ============================================================
# 本地预写日志目录：仅使用本地文件，不依赖任何外部中间件
reliable-events.store-dir=data/reliable-events
# 最大尝试次数（含首次），达到后瞬时故障进入死信 RETRIES_EXHAUSTED
reliable-events.max-attempts=5
# 指数退避：首次基础退避 / 退避上限 / 随机抖动（毫秒）
reliable-events.base-backoff-millis=200
reliable-events.max-backoff-millis=5000
reliable-events.jitter-millis=50
# 消费租约：消费者崩溃后，超过该时长未终态的事件可被重新领取
reliable-events.lease-millis=30000
# 后台分发器轮询间隔与消费线程数
reliable-events.poll-interval-millis=50
reliable-events.worker-count=2
